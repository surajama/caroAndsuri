<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare outline colours</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      padding: 16px;
      background: #1c1410;
      color: #f6efe4;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 { font-size: 1.2rem; font-weight: normal; }

    button {
      font: inherit;
      font-size: 1rem;
      padding: 8px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff 50%, #b3871a 50%);
      color: #1c1410;
      cursor: pointer;
    }

    .options {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    figure {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
    }

    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    iframe {
      width: 100%;
      flex: 1;
      min-height: 320px;
      border: 0;
      border-radius: 10px;
      background: #000;
    }

    @media (max-width: 700px) {
      .options { grid-template-columns: 1fr; }
      iframe { min-height: 70dvh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Flower outline colour: which do you prefer?</h1>
    <button type="button" id="replay">Replay both</button>
  </header>
  <div class="options">
    <figure>
      <figcaption><span class="swatch" style="background:#fff"></span>White outline (current)</figcaption>
      <iframe src="index-glass-panel.html" title="White outline"></iframe>
    </figure>
    <figure>
      <figcaption><span class="swatch" style="background:#b3871a"></span>Dark yellow outline</figcaption>
      <iframe src="index-glass-panel-dark-yellow-outline.html" title="Dark yellow outline"></iframe>
    </figure>
  </div>
  <script>
    // Restart both animations together.
    document.getElementById('replay').addEventListener('click', () => {
      document.querySelectorAll('iframe').forEach((frame) => frame.contentWindow.location.reload());
    });
  </script>
</body>
</html>
