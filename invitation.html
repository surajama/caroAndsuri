<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Caro & Suri · Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --book-size: min(92vw, 84dvh);
    }

    html, body { width: 100%; height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2dvh;
      overflow: hidden;
      background: #2a1d14;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* The stained-glass wall from the landing page, softly out of focus behind the invitation */
    body::before {
      content: '';
      position: fixed;
      inset: -40px;
      background: url('glass-wall.jpg') center / cover;
      filter: blur(14px) brightness(0.5) saturate(0.9);
      z-index: -1;
    }

    .book {
      position: relative;
      width: var(--book-size);   /* replaced by the script with the card's exact size */
      height: var(--book-size);
      perspective: 2400px;
      cursor: pointer;
    }

    /* One sheet of the invitation. The wrapper casts the shadows (including into the cut-out
       below it); the sheet inside is the paper, with its window cut out by a mask. */
    .sheet {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      backface-visibility: hidden;
      filter: drop-shadow(0 2px 2.5px rgba(40, 20, 10, 0.35)) drop-shadow(0 10px 22px rgba(20, 10, 5, 0.25));
      transition: transform 1.05s cubic-bezier(0.45, 0.05, 0.25, 1), opacity 0.45s linear;
    }

    .sheet.turned {
      transform: rotateY(-180deg);
      opacity: 0;
      pointer-events: none;
      transition-delay: 0s, 0.4s;
    }

    .paper {
      position: absolute;
      inset: 0;
      container-type: inline-size;
      background-color: var(--paper);
      background-blend-mode: multiply;
      background-size: 220px 220px;
      border-radius: 0.6%;
      color: var(--ink);
    }

    .paper > svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .words {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 18.5%;
      text-align: center;
      line-height: 1.25;
    }

    .event {
      font-size: 4.6cqw;
      font-weight: 600;
      letter-spacing: 0.11em;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .flourish {
      display: block;
      width: 22cqw;
      height: 3cqw;
      margin: 1.6cqw auto 1.4cqw;
    }

    .venue {
      position: absolute;
      left: 0;
      right: 0;
      top: 78.5%;
      text-align: center;
      font-size: 2.8cqw;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.92;
    }

    .names {
      position: absolute;
      left: 0;
      right: 0;
      top: 87.6%;
      text-align: center;
      font-size: 3.6cqw;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .names.cover {
      top: 84%;
      font-size: 4.3cqw;
      letter-spacing: 0.22em;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(255, 246, 232, 0.85);
      font-size: clamp(14px, 2.2dvh, 18px);
      font-style: italic;
    }

    .dots { display: flex; gap: 8px; }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 246, 232, 0.35);
      transition: background 0.3s, transform 0.3s;
    }

    .dots span.on {
      background: #e9b949;
      transform: scale(1.3);
    }

    @media (prefers-reduced-motion: reduce) {
      .sheet, .sheet.turned { transition: opacity 0.4s linear; }
      .sheet.turned { transform: none; }
    }
  </style>
</head>
<body>
  <div class="book" id="book" aria-live="polite"></div>
  <div class="nav">
    <div class="dots" id="dots"></div>
    <span id="hint">Tap to turn the page</span>
  </div>

  <script>
    // ---------------------------------------------------------------------------------------
    // The five sheets, top to bottom. Each sheet's window (cut-out) is smaller than the one
    // above, so together they build a layered mandala; the outermost window is the flower logo.
    // Sheet 0 is the cover; each later sheet is one event.
    // ---------------------------------------------------------------------------------------
    const NAMES = 'Caroline & Suraj';
    // Colours from Caroline's swatch card: olive #858248, lilac #937C91, blue #8494A1,
    // cream #D7CFBE, burgundy #491B12, dark brown #2D2011.
    const SWATCH = { olive: '#858248', lilac: '#937C91', blue: '#8494A1', cream: '#D7CFBE', burgundy: '#491B12', brown: '#2D2011' };
    const SHEETS = [
      { event: null, paper: SWATCH.lilac, ink: SWATCH.cream, accent: SWATCH.cream, window: 'flower' },
      // Printed all over with a small Mughal trellis of flower bouquets instead of the border and sprigs.
      { event: 'Mehendi', venue: 'Faena River Club',
        paper: SWATCH.burgundy, ink: SWATCH.cream, accent: SWATCH.cream, window: 'mehendiFrame', pattern: 'trellis' },
      { event: 'Wedding Ceremony', venue: 'Casa de Pilatos', paper: SWATCH.cream, ink: SWATCH.olive, accent: SWATCH.olive, window: 'gardenOctagon' },
      // Printed with the venue ceiling, its twelve-pointed star centred behind this card's window.
      { event: 'Reception', venue: 'Casa de Pilatos', paper: '#3a2a1c', ink: SWATCH.cream, accent: SWATCH.cream, window: 'fountain',
        // aspect = photo height / width; (fx, fy) = the star's centre in the photo; minZoom = photo width in card widths
        photo: { src: 'ceiling.jpg', aspect: 4032 / 3024, fx: 1468 / 3024, fy: 1992 / 4032, minZoom: 1.03 } },
      { event: 'Pheras', venue: 'Hacienda Villanueva del Pitamo',
        paper: SWATCH.olive, ink: SWATCH.cream, accent: SWATCH.cream, window: 'square' },
      { event: 'Reception & Sangeet', venue: 'Hacienda Villanueva del Pitamo', paper: SWATCH.blue, ink: SWATCH.burgundy, accent: SWATCH.burgundy, window: 'weddingQuatrefoil' },
    ];
    // The back of the invitation, seen through the last card's window.
    const BACK = { paper: SWATCH.brown, flower: SWATCH.cream };

    // Page coordinates: 1000 across, H down (1000 for a square card, more for a tall phone card).
    // The mandala is centred at (CX, CY), the exact centre of the card.
    let H = 1000;
    const CX = 500;
    let CY = 500;

    // ---- Shapes, as radius-by-angle functions (angles in degrees, 0 = right, clockwise) ----
    const rad = (deg) => (deg * Math.PI) / 180;
    // Angular distance from `deg` to the nearest of `count` evenly spaced directions starting at `start`.
    const nearest = (deg, start, count) => {
      const step = 360 / count;
      const d = ((((deg - start) % step) + step) % step);
      return d > step / 2 ? d - step : d;
    };

    // The logo's flower: five overlapping circles (centre 242 out, radius 241, in logo units, tip at 483).
    const flowerR = (tip, turn = 0) => (deg) => {
      const s = tip / 483, d = 242 * s, R = 241 * s;
      const a = rad(nearest(deg, -90 + turn, 5));
      return d * Math.cos(a) + Math.sqrt(R * R - (d * Math.sin(a)) ** 2);
    };
    const SHAPES = {
      // Card 0: the logo's flower.
      flower: flowerR(240),
      // Card 1: the outer frame of the Mehendi invitation's mandala: flat sides with small stepped
      // notches at their ends, and scalloped curves around each corner.
      mehendiFrame: (deg) => {
        const a = 173, d = Math.abs(nearest(deg, 0, 4));
        if (d <= 15) return a / Math.cos(rad(d));
        if (d <= 18.5) return (0.935 * a) / Math.cos(rad(d));
        return a * (0.985 + 0.07 * Math.pow(Math.sin((Math.PI * (d - 18.5)) / 26.5), 0.6));
      },
      // Card 2: the octagonal fountain plaza at the centre of the Casa de Pilatos garden.
      gardenOctagon: (deg) => (139 / Math.cos(rad(nearest(deg, -90, 8)))),
      // Card 3: the courtyard fountain basin: a square with a rounded lobe bulging from each side.
      fountain: (deg) => {
        const s = 81, lobe = 38, d = rad(Math.abs(nearest(deg, 0, 4)));
        const square = s / Math.cos(d);
        const arc = s * Math.sin(d) <= lobe ? s * Math.cos(d) + Math.sqrt(lobe * lobe - (s * Math.sin(d)) ** 2) : 0;
        return Math.max(square, arc);
      },
      // Card 4: a square.
      square: (deg) => 60 / Math.cos(rad(nearest(deg, 0, 4))),
      // Card 5: the Wedding invitation's window: four pointed arch tips with soft curves between.
      weddingQuatrefoil: (deg) => {
        const R = 55, f = Math.abs(nearest(deg, -90, 4)) / 45;
        return R * (1 - 0.42 * Math.pow(f, 0.55) + 0.1 * Math.pow(Math.sin(Math.PI * f), 1.5));
      },
    };

    function outline(shape, offset = 0, steps = 360) {
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const deg = (i / steps) * 360;
        const r = SHAPES[shape](deg) + offset;
        pts.push([CX + r * Math.cos(rad(deg)), CY + r * Math.sin(rad(deg))]);
      }
      return pts;
    }
    const toPath = (pts) => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L') + 'Z';

    // ---- Paper grain: a soft speckled texture, multiplied over each sheet's colour ----
    function paperGrain() {
      const size = 220, c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d'), img = g.createImageData(size, size);
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < size * size; i++) {
        const v = 236 + rnd() * 19 - (rnd() < 0.012 ? 18 : 0);
        img.data.set([v, v, v, 255], i * 4);
      }
      g.putImageData(img, 0, 0);
      return c.toDataURL();
    }
    const GRAIN = `url(${paperGrain()})`;

    // ---- Printed decoration (SVG markup in page coordinates) ----
    const petal = (x, y, angle, len, wid, fill) =>
      `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${len}" ry="${wid}" transform="rotate(${angle.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${fill}"/>`;

    function smallBloom(x, y, size, petalFill, centreFill) {
      let s = '';
      for (let k = 0; k < 5; k++) {
        const a = -90 + k * 72, px = x + Math.cos(rad(a)) * size * 0.55, py = y + Math.sin(rad(a)) * size * 0.55;
        s += petal(px, py, a, size * 0.55, size * 0.32, petalFill);
      }
      return s + `<circle cx="${x}" cy="${y}" r="${size * 0.22}" fill="${centreFill}"/>`;
    }

    // Ornamental border: a band between two fine rules, filled with little blooms and diamonds.
    function border(ink, accent) {
      const o = 36, i = 76, mid = (o + i) / 2;
      let s = `<g fill="none" stroke="${ink}" stroke-width="2.2">
        <rect x="${o}" y="${o}" width="${1000 - 2 * o}" height="${H - 2 * o}"/>
        <rect x="${i}" y="${i}" width="${1000 - 2 * i}" height="${H - 2 * i}"/>
        <rect x="${o + 5}" y="${o + 5}" width="${1000 - 2 * o - 10}" height="${H - 2 * o - 10}" stroke-width="0.8"/>
        <rect x="${i - 5}" y="${i - 5}" width="${1000 - 2 * i + 10}" height="${H - 2 * i + 10}" stroke-width="0.8"/>
      </g>`;
      const motif = (x, y, k) => k % 2 === 0
        ? smallBloom(x, y, 7.5, ink, accent)
        : `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" transform="rotate(45 ${x} ${y})" fill="${accent}"/>`;
      // evenly spaced motifs along a run of the band, centred on it
      const along = (length, centre) => {
        const count = Math.floor((length - 2 * i) / 31);
        const step = (length - 2 * i) / count;
        return Array.from({ length: count }, (_, k) => centre - ((count - 1) * step) / 2 + k * step);
      };
      along(1000, 500).forEach((x, k) => { s += motif(x, mid, k) + motif(x, H - mid, k); });
      along(H, H / 2).forEach((y, k) => { s += motif(mid, y, k) + motif(1000 - mid, y, k); });
      for (const [x, y] of [[mid, mid], [1000 - mid, mid], [mid, H - mid], [1000 - mid, H - mid]]) {
        s += `<rect x="${x - 15}" y="${y - 15}" width="30" height="30" fill="${ink}"/>` + smallBloom(x, y, 10, accent, ink);
      }
      return s;
    }

    // A little flowering sprig for each inner corner.
    function sprig(ink, accent) {
      let s = `<path d="M0 0 C 30 8, 52 26, 64 58 M18 6 C 26 -10, 44 -14, 58 -8 M34 22 C 50 18, 66 24, 76 36"
                     fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
      s += petal(46, 34, 40, 9, 3.6, ink) + petal(30, 8, -20, 9, 3.6, ink) + petal(62, 44, 70, 8, 3.2, ink);
      s += smallBloom(0, 0, 11, accent, ink) + smallBloom(58, -8, 7, accent, ink) + smallBloom(76, 36, 6, accent, ink);
      return s;
    }

    function corners(ink, accent) {
      const one = sprig(ink, accent), d = 118;
      return [[d, d, 1, 1], [1000 - d, d, -1, 1], [d, H - d, 1, -1], [1000 - d, H - d, -1, -1]]
        .map(([x, y, sx, sy]) => `<g transform="translate(${x} ${y}) scale(${sx} ${sy})">${one}</g>`).join('');
    }

    // ---- An all-over Mughal-style pattern: a lilac ogee trellis with a little bouquet in every cell ----
    // Cells are TW x TH and set in a diamond (half-drop) arrangement; one cell is centred on the card.
    const TW = 180, TH = 262;

    function blossom(x, y, r, petalFill, centreFill) {
      let s = '';
      for (let k = 0; k < 10; k++) {
        const a = k * 36, px = x + Math.cos(rad(a)) * r * 0.58, py = y + Math.sin(rad(a)) * r * 0.58;
        s += petal(px, py, a, r * 0.46, r * 0.24, petalFill);
      }
      return s + `<circle cx="${x}" cy="${y}" r="${r * 0.32}" fill="${centreFill}"/>`;
    }

    // A bouquet centred on (0, 0): three blossoms and two buds on olive stems, with long leaves.
    function bouquet(petalFill, centreFill) {
      const leaf = SWATCH.olive;
      let s = `<g fill="none" stroke="${leaf}" stroke-width="3.4" stroke-linecap="round">
        <path d="M0 96 C 0 40, 0 -10, 0 -50"/>
        <path d="M0 22 C -14 8, -28 -4, -38 -14"/><path d="M0 22 C 14 8, 28 -4, 38 -14"/>
        <path d="M0 -24 C -8 -34, -16 -40, -21 -46"/><path d="M0 -24 C 8 -34, 16 -40, 21 -46"/>
      </g>`;
      s += petal(-19, 74, -38, 24, 6.5, leaf) + petal(19, 74, 38, 24, 6.5, leaf);
      s += petal(-14, 46, -58, 17, 5, leaf) + petal(14, 46, 58, 17, 5, leaf);
      s += petal(-22, -49, -60, 7, 4, petalFill) + petal(22, -49, 60, 7, 4, petalFill);
      s += blossom(-40, -18, 17, petalFill, centreFill) + blossom(40, -18, 17, petalFill, centreFill);
      s += blossom(0, -64, 22, petalFill, centreFill);
      return s;
    }

    function trellisPattern(id) {
      const w = TW, h = TH, line = SWATCH.lilac;
      // one cell's four ogee sides, meeting at the middle of each tile edge
      const sides = `M${w / 2} 0 C ${w * 0.6} ${h * 0.15}, ${w} ${h * 0.2}, ${w} ${h / 2}
        C ${w} ${h * 0.8}, ${w * 0.6} ${h * 0.85}, ${w / 2} ${h}
        C ${w * 0.4} ${h * 0.85}, 0 ${h * 0.8}, 0 ${h / 2}
        C 0 ${h * 0.2}, ${w * 0.4} ${h * 0.15}, ${w / 2} 0 Z`;
      const knots = [[w / 2, 0], [w, h / 2], [w / 2, h], [0, h / 2]]
        .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="8" fill="${line}"/><circle cx="${x}" cy="${y}" r="3" fill="${SWATCH.burgundy}"/>`).join('');
      // bouquets: cream-and-lilac in the cell centred on the tile, lilac-and-cream in the cells at its corners
      const corner = bouquet(SWATCH.lilac, SWATCH.cream);
      const scale = 0.62;
      return `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${w}" height="${h}" x="${CX - w / 2}" y="${CY - h / 2}">
        <path d="${sides}" fill="none" stroke="${line}" stroke-width="5"/>
        ${knots}
        <g transform="translate(${w / 2} ${h / 2}) scale(${scale})">${bouquet(SWATCH.cream, SWATCH.lilac)}</g>
        ${[[0, 0], [w, 0], [0, h], [w, h]].map(([x, y]) => `<g transform="translate(${x} ${y}) scale(${scale})">${corner}</g>`).join('')}
      </pattern>`;
    }

    // The pattern over the whole card, with clear space around the window and behind the words.
    function patternArt(page, id) {
      // clear panels in the paper colour, each edged with a fine lilac line so they sit in the pattern like frames
      const panel = `fill="${page.paper}" stroke="${SWATCH.lilac}" stroke-width="2.5"`;
      let s = `<defs>${trellisPattern(id)}</defs><rect width="1000" height="${H}" fill="url(#${id})"/>`;
      s += `<path d="${toPath(outline(page.window, 26))}" ${panel}/>`;
      const titleY = 185 - 30, venueY = H - 215 - 22;
      s += `<rect x="300" y="${titleY}" width="400" height="142" rx="71" ${panel}/>`;
      if (page.venue) {
        const width = 48 + page.venue.length * 19;
        s += `<rect x="${500 - width / 2}" y="${venueY}" width="${width}" height="72" rx="36" ${panel}/>`;
      }
      return s;
    }

    // A ring of tiny printed leaves just outside a window, following its edge.
    function windowRing(shape, colour) {
      const pts = outline(shape, 15, 720);
      let length = 0;
      const seg = pts.map((p, k) => {
        const q = pts[(k + 1) % pts.length];
        const l = Math.hypot(q[0] - p[0], q[1] - p[1]);
        length += l;
        return l;
      });
      const count = Math.max(10, Math.round(length / 26 / 2) * 2);
      let s = '', walked = 0, next = 0, n = 0;
      for (let k = 0; k < pts.length && n < count; k++) {
        if (walked >= next) {
          const [x, y] = pts[k], [qx, qy] = pts[(k + 1) % pts.length];
          const tangent = (Math.atan2(qy - y, qx - x) * 180) / Math.PI;
          s += n % 2 === 0 ? petal(x, y, tangent + 30, 6.5, 2.6, colour) : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="${colour}"/>`;
          n++;
          next = (n * length) / count;
        }
        walked += seg[k];
      }
      return s;
    }

    // The window itself: everything except the shape is paper (alpha mask).
    function windowMask(shape) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 ${H}" preserveAspectRatio="none">` +
        `<path fill-rule="evenodd" fill="#000" d="M0 0H1000V${H}H0Z ${toPath(outline(shape))}"/></svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }

    // ---- Build the book ----
    // Cards are square, except on narrow phone screens where they grow taller (up to 1.5x) to fill more
    // of the screen. Everything is drawn for the card's shape, so nothing stretches.
    const book = document.getElementById('book');
    const dots = document.getElementById('dots');
    SHAPES.backFlower = flowerR(28);
    let sheets = [];
    let current = 0;

    function cardShape() {
      const width = Math.min(innerWidth * 0.92, innerHeight * 0.84);
      const tall = innerWidth / innerHeight < 0.7;
      const ratio = tall ? Math.min(1.5, Math.max(1, (innerHeight * 0.8) / width)) : 1;
      return { width, ratio };
    }

    function build() {
      const { width, ratio } = cardShape();
      H = Math.round(1000 * ratio);
      CY = H / 2;
      book.style.width = `${width}px`;
      book.style.height = `${width * ratio}px`;
      book.innerHTML = '';
      dots.innerHTML = '';

      // ---- Build the sheets ----
      // The back of the invitation: dark board with a tiny flower at the centre of the mandala.
      const back = document.createElement('div');
      back.className = 'sheet back';
      back.innerHTML = `<div class="paper" style="--paper:${BACK.paper}; background-image:${GRAIN}">
        <svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">
          <path d="${toPath(outline('backFlower'))}" fill="${BACK.flower}"/>
        </svg></div>`;
      book.appendChild(back);

      sheets = SHEETS.map((page, i) => {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        sheet.style.zIndex = SHEETS.length - i;

        const paper = document.createElement('div');
        paper.className = 'paper';
        paper.style.setProperty('--paper', page.paper);
        paper.style.setProperty('--ink', page.ink);
        if (page.photo) {
          // a photo-printed card: the photo, gently darkened at the top and bottom so the words stay readable
          const shade = 'linear-gradient(to bottom, rgba(20,12,6,0.72) 0%, rgba(20,12,6,0.55) 18%, rgba(20,12,6,0.1) 34%, rgba(20,12,6,0.1) 66%, rgba(20,12,6,0.55) 82%, rgba(20,12,6,0.72) 100%)';
          paper.style.backgroundImage = `${shade}, url('${page.photo.src}')`;
          const { aspect, fx, fy, minZoom } = page.photo;
          // zoom just enough that the photo covers the whole card with the star at its centre
          const zoom = Math.max(minZoom, (H / 2) / (Math.min(fy, 1 - fy) * 1000 * aspect));
          const zoomY = (zoom * 1000 * aspect) / H;
          const posX = ((0.5 - fx * zoom) / (1 - zoom)) * 100, posY = ((0.5 - fy * zoomY) / (1 - zoomY)) * 100;
          paper.style.backgroundSize = `100% 100%, ${zoom * 100}% auto`;
          paper.style.backgroundPosition = `0 0, ${posX}% ${posY}%`;
          paper.style.backgroundRepeat = 'no-repeat';
          paper.style.backgroundBlendMode = 'normal';
        } else {
          paper.style.backgroundImage = GRAIN;
        }
        if (page.window) {
          paper.style.maskImage = paper.style.webkitMaskImage = windowMask(page.window);
          paper.style.maskSize = paper.style.webkitMaskSize = '100% 100%';
        }

        let art = page.pattern ? patternArt(page, `trellis-${i}`) : border(page.ink, page.accent) + corners(page.ink, page.accent);
        if (page.window) {
          // the white core of the card showing at the cut edge, then (on plain cards) the printed leaf ring
          art += `<path d="${toPath(outline(page.window))}" fill="none" stroke="#fffaf0" stroke-opacity="0.85" stroke-width="6"/>`;
          if (!page.pattern) art += windowRing(page.window, page.accent);
        }

        paper.innerHTML = `
          <svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">${art}</svg>
          ${page.event ? `<div class="words" style="top:${(185 / H) * 100}%">
            <div class="event">${page.event}</div>
            <svg class="flourish" viewBox="0 0 220 30" aria-hidden="true">
              <path d="M8 15 H86 M134 15 H212" stroke="currentColor" stroke-width="1.4"/>
              ${smallBloom(110, 15, 9, page.accent, page.ink)}
              <circle cx="96" cy="15" r="2.4" fill="currentColor"/><circle cx="124" cy="15" r="2.4" fill="currentColor"/>
            </svg>
          </div>` : ''}
          ${page.venue ? `<div class="venue" style="top:${((H - 215) / H) * 100}%">${page.venue}</div>` : ''}
          ${page.event ? '' : `<div class="names cover" style="top:${((H - 160) / H) * 100}%">${NAMES}</div>`}`;

        sheet.appendChild(paper);
        book.appendChild(sheet);
        dots.appendChild(document.createElement('span'));
        return sheet;
      });
      show(current);
    }

    // ---- Turning pages ----
    function show(index) {
      current = (index + SHEETS.length) % SHEETS.length;
      sheets.forEach((sheet, i) => sheet.classList.toggle('turned', i < current));
      [...dots.children].forEach((dot, i) => dot.classList.toggle('on', i === current));
      document.getElementById('hint').textContent =
        current === SHEETS.length - 1 ? 'Tap to start again' : 'Tap to turn the page';
    }
    const next = () => show(current + 1);
    const prev = () => show(current - 1);

    book.addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') prev();
    });
    let touchX = null;
    book.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    book.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) { e.preventDefault(); dx < 0 ? next() : prev(); }
    });
    build();
    // Re-draw for a new card shape when the screen is resized or turned.
    let resizeTimer;
    addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 200);
    });
  </script>
</body>
</html>
