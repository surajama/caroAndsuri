<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Caro & Suri · Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --book-size: min(92vw, 84dvh);
    }

    html, body { width: 100%; height: 100%; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2dvh;
      overflow: hidden;
      background: #2a1d14;
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* The stained-glass wall from the landing page, softly out of focus behind the invitation */
    body::before {
      content: '';
      position: fixed;
      inset: -40px;
      background: url('glass-wall.jpg') center / cover;
      filter: blur(14px) brightness(0.5) saturate(0.9);
      z-index: -1;
    }

    .book {
      position: relative;
      width: var(--book-size);
      height: var(--book-size);
      perspective: 2400px;
      cursor: pointer;
    }

    /* One sheet of the invitation. The wrapper casts the shadows (including into the cut-out
       below it); the sheet inside is the paper, with its window cut out by a mask. */
    .sheet {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      backface-visibility: hidden;
      filter: drop-shadow(0 2px 2.5px rgba(40, 20, 10, 0.35)) drop-shadow(0 10px 22px rgba(20, 10, 5, 0.25));
      transition: transform 1.05s cubic-bezier(0.45, 0.05, 0.25, 1), opacity 0.45s linear;
    }

    .sheet.turned {
      transform: rotateY(-180deg);
      opacity: 0;
      pointer-events: none;
      transition-delay: 0s, 0.4s;
    }

    .paper {
      position: absolute;
      inset: 0;
      container-type: inline-size;
      background-color: var(--paper);
      background-blend-mode: multiply;
      background-size: 220px 220px;
      border-radius: 0.6%;
      color: var(--ink);
    }

    .paper > svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .words {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 58.5%;
      text-align: center;
      line-height: 1.25;
    }

    .invite-line {
      font-style: italic;
      font-size: 3.5cqw;
      opacity: 0.85;
    }

    .event {
      margin-top: 1.2cqw;
      font-size: 4.3cqw;
      font-weight: 600;
      letter-spacing: 0.11em;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .flourish {
      display: block;
      width: 22cqw;
      height: 3cqw;
      margin: 1.6cqw auto 1.4cqw;
    }

    .details {
      font-size: 3.3cqw;
      letter-spacing: 0.04em;
    }

    .names {
      position: absolute;
      left: 0;
      right: 0;
      top: 87.6%;
      text-align: center;
      font-size: 3.6cqw;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(255, 246, 232, 0.85);
      font-size: clamp(14px, 2.2dvh, 18px);
      font-style: italic;
    }

    .dots { display: flex; gap: 8px; }

    .dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 246, 232, 0.35);
      transition: background 0.3s, transform 0.3s;
    }

    .dots span.on {
      background: #e9b949;
      transform: scale(1.3);
    }

    @media (prefers-reduced-motion: reduce) {
      .sheet, .sheet.turned { transition: opacity 0.4s linear; }
      .sheet.turned { transform: none; }
    }
  </style>
</head>
<body>
  <div class="book" id="book" aria-live="polite"></div>
  <div class="nav">
    <div class="dots" id="dots"></div>
    <span id="hint">Tap to turn the page</span>
  </div>

  <script>
    // ---------------------------------------------------------------------------------------
    // The five sheets, top to bottom. Each sheet's window (cut-out) is smaller than the one
    // above, so together they build a layered mandala; the outermost window is the flower logo.
    // Wording other than the event names is placeholder until the details are confirmed.
    // ---------------------------------------------------------------------------------------
    const NAMES = 'Caroline & Suraj';
    const SHEETS = [
      { event: 'Mehendi & Welcome Party', paper: '#ecd2d0', ink: '#3f5f49', accent: '#b4566c', window: 'flower' },
      { event: 'Wedding Ceremony',        paper: '#e9b949', ink: '#553810', accent: '#fff7e6', window: 'rosette' },
      // Printed with the venue ceiling, its twelve-pointed star centred behind this card's window.
      { event: 'Reception',               paper: '#3a2a1c', ink: '#f7ecd6', accent: '#e9b949', window: 'star',
        photo: { src: 'ceiling.jpg', size: '182.8% auto', position: '46.79% 59.77%' } },
      { event: 'Pheras',                  paper: '#3e5c48', ink: '#f4e8d0', accent: '#e9b949', window: 'smallFlower' },
      { event: 'Reception & Sangeet',     paper: '#f4ecdc', ink: '#3f5f49', accent: '#e9b949', window: null },
    ];

    // Page coordinates are 0..1000 on each side; the mandala is centred here.
    const CX = 500, CY = 345;

    // ---- Shapes, as radius-by-angle functions (angles in degrees, 0 = right, clockwise) ----
    const rad = (deg) => (deg * Math.PI) / 180;
    // Angular distance from `deg` to the nearest of `count` evenly spaced directions starting at `start`.
    const nearest = (deg, start, count) => {
      const step = 360 / count;
      const d = ((((deg - start) % step) + step) % step);
      return d > step / 2 ? d - step : d;
    };

    // The logo's flower: five overlapping circles (centre 242 out, radius 241, in logo units, tip at 483).
    const flowerR = (tip, turn = 0) => (deg) => {
      const s = tip / 483, d = 242 * s, R = 241 * s;
      const a = rad(nearest(deg, -90 + turn, 5));
      return d * Math.cos(a) + Math.sqrt(R * R - (d * Math.sin(a)) ** 2);
    };
    const SHAPES = {
      flower: flowerR(208),
      // Ten soft scallops, the larger ones pointing into the flower's petals.
      rosette: (deg) => 126 + 18 * Math.abs(Math.cos(rad(5 * (deg + 90)))),
      // Five pointed arches, tips pointing into the petals.
      star: (deg) => 100 * (0.66 + 0.34 * Math.pow(1 - Math.abs(nearest(deg, -90, 5)) / 36, 1.7)),
      // A small flower, turned to sit between the star's points.
      smallFlower: flowerR(63, 36),
    };

    function outline(shape, offset = 0, steps = 360) {
      const pts = [];
      for (let i = 0; i < steps; i++) {
        const deg = (i / steps) * 360;
        const r = SHAPES[shape](deg) + offset;
        pts.push([CX + r * Math.cos(rad(deg)), CY + r * Math.sin(rad(deg))]);
      }
      return pts;
    }
    const toPath = (pts) => 'M' + pts.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L') + 'Z';

    // ---- Paper grain: a soft speckled texture, multiplied over each sheet's colour ----
    function paperGrain() {
      const size = 220, c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d'), img = g.createImageData(size, size);
      let seed = 7;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < size * size; i++) {
        const v = 236 + rnd() * 19 - (rnd() < 0.012 ? 18 : 0);
        img.data.set([v, v, v, 255], i * 4);
      }
      g.putImageData(img, 0, 0);
      return c.toDataURL();
    }
    const GRAIN = `url(${paperGrain()})`;

    // ---- Printed decoration (SVG markup in page coordinates) ----
    const petal = (x, y, angle, len, wid, fill) =>
      `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${len}" ry="${wid}" transform="rotate(${angle.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${fill}"/>`;

    function smallBloom(x, y, size, petalFill, centreFill) {
      let s = '';
      for (let k = 0; k < 5; k++) {
        const a = -90 + k * 72, px = x + Math.cos(rad(a)) * size * 0.55, py = y + Math.sin(rad(a)) * size * 0.55;
        s += petal(px, py, a, size * 0.55, size * 0.32, petalFill);
      }
      return s + `<circle cx="${x}" cy="${y}" r="${size * 0.22}" fill="${centreFill}"/>`;
    }

    // Ornamental border: a band between two fine rules, filled with little blooms and diamonds.
    function border(ink, accent) {
      const o = 36, i = 76, mid = (o + i) / 2;
      let s = `<g fill="none" stroke="${ink}" stroke-width="2.2">
        <rect x="${o}" y="${o}" width="${1000 - 2 * o}" height="${1000 - 2 * o}"/>
        <rect x="${i}" y="${i}" width="${1000 - 2 * i}" height="${1000 - 2 * i}"/>
        <rect x="${o + 5}" y="${o + 5}" width="${1000 - 2 * o - 10}" height="${1000 - 2 * o - 10}" stroke-width="0.8"/>
        <rect x="${i - 5}" y="${i - 5}" width="${1000 - 2 * i + 10}" height="${1000 - 2 * i + 10}" stroke-width="0.8"/>
      </g>`;
      const step = 31, count = Math.floor((1000 - 2 * i) / step);
      const start = 500 - ((count - 1) * step) / 2;
      for (let k = 0; k < count; k++) {
        const p = start + k * step;
        for (const [x, y] of [[p, mid], [p, 1000 - mid], [mid, p], [1000 - mid, p]]) {
          s += k % 2 === 0
            ? smallBloom(x, y, 7.5, ink, accent)
            : `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" transform="rotate(45 ${x} ${y})" fill="${accent}"/>`;
        }
      }
      for (const [x, y] of [[mid, mid], [1000 - mid, mid], [mid, 1000 - mid], [1000 - mid, 1000 - mid]]) {
        s += `<rect x="${x - 15}" y="${y - 15}" width="30" height="30" fill="${ink}"/>` + smallBloom(x, y, 10, accent, ink);
      }
      return s;
    }

    // A little flowering sprig for each inner corner.
    function sprig(ink, accent) {
      let s = `<path d="M0 0 C 30 8, 52 26, 64 58 M18 6 C 26 -10, 44 -14, 58 -8 M34 22 C 50 18, 66 24, 76 36"
                     fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
      s += petal(46, 34, 40, 9, 3.6, ink) + petal(30, 8, -20, 9, 3.6, ink) + petal(62, 44, 70, 8, 3.2, ink);
      s += smallBloom(0, 0, 11, accent, ink) + smallBloom(58, -8, 7, accent, ink) + smallBloom(76, 36, 6, accent, ink);
      return s;
    }

    function corners(ink, accent) {
      const one = sprig(ink, accent), d = 118;
      return [[d, d, 1, 1], [1000 - d, d, -1, 1], [d, 1000 - d, 1, -1], [1000 - d, 1000 - d, -1, -1]]
        .map(([x, y, sx, sy]) => `<g transform="translate(${x} ${y}) scale(${sx} ${sy})">${one}</g>`).join('');
    }

    // A ring of tiny printed leaves just outside a window, following its edge.
    function windowRing(shape, colour) {
      const pts = outline(shape, 15, 720);
      let length = 0;
      const seg = pts.map((p, k) => {
        const q = pts[(k + 1) % pts.length];
        const l = Math.hypot(q[0] - p[0], q[1] - p[1]);
        length += l;
        return l;
      });
      const count = Math.max(10, Math.round(length / 26 / 2) * 2);
      let s = '', walked = 0, next = 0, n = 0;
      for (let k = 0; k < pts.length && n < count; k++) {
        if (walked >= next) {
          const [x, y] = pts[k], [qx, qy] = pts[(k + 1) % pts.length];
          const tangent = (Math.atan2(qy - y, qx - x) * 180) / Math.PI;
          s += n % 2 === 0 ? petal(x, y, tangent + 30, 6.5, 2.6, colour) : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="${colour}"/>`;
          n++;
          next = (n * length) / count;
        }
        walked += seg[k];
      }
      return s;
    }

    // The window itself: everything except the shape is paper (alpha mask).
    function windowMask(shape) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">` +
        `<path fill-rule="evenodd" fill="#000" d="M0 0H1000V1000H0Z ${toPath(outline(shape))}"/></svg>`;
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }

    // ---- Build the sheets ----
    const book = document.getElementById('book');
    const dots = document.getElementById('dots');
    const sheets = SHEETS.map((page, i) => {
      const sheet = document.createElement('div');
      sheet.className = 'sheet';
      sheet.style.zIndex = SHEETS.length - i;

      const paper = document.createElement('div');
      paper.className = 'paper';
      paper.style.setProperty('--paper', page.paper);
      paper.style.setProperty('--ink', page.ink);
      if (page.photo) {
        // a photo-printed card: the photo, gently darkened towards the words so they stay readable
        const shade = 'linear-gradient(to bottom, rgba(20,12,6,0.12) 40%, rgba(20,12,6,0.62) 62%, rgba(20,12,6,0.72) 100%)';
        paper.style.backgroundImage = `${shade}, url('${page.photo.src}')`;
        paper.style.backgroundSize = `100% 100%, ${page.photo.size}`;
        paper.style.backgroundPosition = `0 0, ${page.photo.position}`;
        paper.style.backgroundRepeat = 'no-repeat';
        paper.style.backgroundBlendMode = 'normal';
      } else {
        paper.style.backgroundImage = GRAIN;
      }
      if (page.window) {
        paper.style.maskImage = paper.style.webkitMaskImage = windowMask(page.window);
        paper.style.maskSize = paper.style.webkitMaskSize = '100% 100%';
      }

      let art = border(page.ink, page.accent) + corners(page.ink, page.accent);
      if (page.window) {
        // the white core of the card showing at the cut edge, then the printed leaf ring
        art += `<path d="${toPath(outline(page.window))}" fill="none" stroke="#fffaf0" stroke-opacity="0.85" stroke-width="6"/>`;
        art += windowRing(page.window, page.accent);
      } else {
        // the very centre of the mandala: a tiny golden flower
        const tiny = (deg) => flowerR(37, 0)(deg);
        SHAPES.tiny = tiny;
        art += `<path d="${toPath(outline('tiny'))}" fill="#e9b949" stroke="#fffaf0" stroke-width="3"/>`;
        art += windowRing('tiny', page.ink);
      }

      paper.innerHTML = `
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">${art}</svg>
        <div class="words">
          <div class="invite-line">please join us for the</div>
          <div class="event">${page.event}</div>
          <svg class="flourish" viewBox="0 0 220 30" aria-hidden="true">
            <path d="M8 15 H86 M134 15 H212" stroke="currentColor" stroke-width="1.4"/>
            ${smallBloom(110, 15, 9, page.accent, page.ink)}
            <circle cx="96" cy="15" r="2.4" fill="currentColor"/><circle cx="124" cy="15" r="2.4" fill="currentColor"/>
          </svg>
          <div class="details">Date &amp; time to be announced<br>Venue to be announced</div>
        </div>
        <div class="names">${NAMES}</div>`;

      sheet.appendChild(paper);
      book.appendChild(sheet);
      dots.appendChild(document.createElement('span'));
      return sheet;
    });

    // ---- Turning pages ----
    let current = 0;
    function show(index) {
      current = (index + SHEETS.length) % SHEETS.length;
      sheets.forEach((sheet, i) => sheet.classList.toggle('turned', i < current));
      [...dots.children].forEach((dot, i) => dot.classList.toggle('on', i === current));
      document.getElementById('hint').textContent =
        current === SHEETS.length - 1 ? 'Tap to start again' : 'Tap to turn the page';
    }
    const next = () => show(current + 1);
    const prev = () => show(current - 1);

    book.addEventListener('click', next);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') prev();
    });
    let touchX = null;
    book.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    book.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 40) { e.preventDefault(); dx < 0 ? next() : prev(); }
    });
    show(0);
  </script>
</body>
</html>
